    has_acceleration_limits: false
  foreArm_joint:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: false
  wrist1_joint:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: false
  wrist2_joint:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: false
  wrist3_joint:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: false
