# MoveIt velocity limits for the JAKA Zu12 canonical joint interface.
default_velocity_scaling_factor: 1.0
default_acceleration_scaling_factor: 0.25

joint_limits:
  shoulder_joint:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: false
